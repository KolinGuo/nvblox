[build-system]
requires = ["scikit_build_core>=0.8.0", "setuptools>=61.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nvblox_torch"
description = "Pytorch interface for nvblox"
requires-python = ">=3.10"
dynamic = ["version"] # Version is dynamically determined
dependencies = [
  "transforms3d>=0.4.2",
  "imageio>=2.35.0",
  "numpy",
  "open3d",
  "timm",
  "opencv-python",
  "einops",
  "nvtx",
  # The specific versions of torch and torchvision are sensitive to platform
  # * On x86 version of the public pypi packages supports CUDA. There we can simply pull them from pypi as usual.
  # * On Jetson, the pypi version does not support CUDA. we instead rely on CUDA-enabled versions being pre-installed on the system.
  #   These are specified in Dockerfile.jetson_deps. In order for these ones to not be overridden here, the version specifications
  #   below has to encompass the pre-installed versions
  "torch",       # 2.3.0 for jetson and 2.4 for x86.
  "torchvision", # 0.18.0a0+6043bc2 for jetson and 0.19 for x86.
  "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8.0", "scikit_build_core>=0.8.0", "ninja"]

[tool.scikit-build]
# Minimum CMake version required
cmake.version = ">=3.22.1"

# Build type
cmake.build-type = "RelWithDebInfo"

# Python package to include
wheel.packages = ["nvblox_torch"]

# Where to install CMake-built artifacts within the wheel
wheel.install-dir = "nvblox_torch/lib"

# Build directory (relative to source)
build-dir = "build/{wheel_tag}"

# CMake arguments
cmake.args = ["-DBUILD_TESTING=OFF", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]

# Editable install mode - use symlinks for Python files, rebuild C++ on install
editable.mode = "redirect"
editable.rebuild = true

# Specify which files to include in sdist for building from source
# Note: When installing from git with #subdirectory=nvblox_torch, the parent
# directories (cmake/, nvblox/) are available since the whole repo is cloned.
sdist.include = [
  "nvblox_torch/**/*.py",
  "cpp/**/*",
  "CMakeLists.txt",
  "setup.py",
  "MANIFEST.in",
]

# Exclude pre-built binaries from sdist (they should be built during install)
sdist.exclude = ["nvblox_torch/lib/**/*.so", "build/**"]

# Dynamic version using regex from _version.py
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "nvblox_torch/_version.py"

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100"]
# NOTE(dtingdahl) files to check are specified in .pre-commit-config.yaml

[tool.uv]
no-build-isolation-package = ["nvblox_torch"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
